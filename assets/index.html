<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastDrop - النقل الفوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        .header h1 { font-size: 2.5rem; color: var(--accent); margin-bottom: 5px; }
        
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1100px; margin: 0 auto; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        .panel { background: var(--surface); border-radius: 20px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); }
        .panel h2 { margin-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px; color: var(--accent); font-size: 1.4rem; }
        
        .upload-area { border: 2px dashed rgba(56, 189, 248, 0.5); border-radius: 16px; padding: 40px 15px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(56, 189, 248, 0.03); display: block; }
        .upload-area:hover { background: rgba(56, 189, 248, 0.08); border-color: var(--accent); }
        .upload-area input { display: none; }
        .upload-area span { display: block; font-size: 1.3rem; font-weight: 900; color: var(--text); margin-bottom: 8px;}
        
        #progress-container { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-top: 15px; display: none; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }
        
        .file-list { display: flex; flex-direction: column; gap: 12px; max-height: 450px; overflow-y: auto; }
        .file-item { background: rgba(0,0,0,0.25); padding: 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .file-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; margin-left: 10px; }
        .file-name { font-weight: 700; font-size: 1rem; word-break: break-all; }
        .file-size { font-size: 0.8rem; color: #94a3b8; }
        
        .btn-download { background: var(--accent); color: #0f172a; text-decoration: none; padding: 8px 18px; border-radius: 10px; font-weight: 900; font-size: 0.95rem; white-space: nowrap; transition: 0.2s; display: inline-block; }
        .btn-download:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <h1>FastDrop ⚡</h1>
        <p>نظام نقل الملفات الأصلي عبر الشبكة المحلية</p>
    </div>

    <div class="container">
        <!-- عمود الرفع -->
        <div class="panel">
            <h2>📤 رفع ملف</h2>
            <label class="upload-area" id="drop-zone">
                <span>اضغط لاختيار ملفات حقيقية</span>
                <p style="color: #94a3b8; font-size: 0.9rem;">يدعم الفيديو، الصور، APK، المستندات، والمضغوطات</p>
                <input type="file" id="file-input" multiple>
            </label>
            
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <p id="upload-status" style="text-align: center; margin-top: 12px; font-weight: bold; font-size: 0.95rem;"></p>
        </div>

        <!-- عمود التنزيل -->
        <div class="panel">
            <h2>📥 الملفات المتاحة</h2>
            <div class="file-list" id="file-list"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const uploadStatus = document.getElementById('upload-status');

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function fetchFiles() {
            try {
                const res = await fetch('/api/files');
                const files = await res.json();
                
                fileList.innerHTML = '';
                if(files.length === 0) {
                    fileList.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">لا توجد ملفات مرفوعة حالياً.</p>';
                    return;
                }

                files.forEach(f => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <div class="file-info">
                            <span class="file-name">${f.name}</span>
                            <span class="file-size">${formatBytes(f.size)}</span>
                        </div>
                        <a href="/api/download?file=${encodeURIComponent(f.name)}" class="btn-download" download="${f.name}">تنزيل</a>
                    `;
                    fileList.appendChild(item);
                });
            } catch (e) { console.error("Error loading files:", e); }
        }

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;

            for (const file of files) {
                await uploadSingleFile(file);
            }
            fileInput.value = '';
            fetchFiles();
        });

        function uploadSingleFile(file) {
            return new Promise((resolve) => {
                progressContainer.style.display = 'block';
                uploadStatus.innerText = `جاري رفع: ${file.name}`;
                uploadStatus.style.color = "var(--text)";
                
                const xhr = new XMLHttpRequest();
                // إرسال الاسم مع التشفير الكامل لضمان الامتداد الأصلي
                xhr.open('POST', `/api/upload?name=${encodeURIComponent(file.name)}`, true);
                
                // تحديد أن المحتوى ثنائي خام مع الحفاظ على النوع الأصلي
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

                xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable) {
                        const percent = (event.loaded / event.total) * 100;
                        progressBar.style.width = percent + '%';
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        uploadStatus.innerText = `✔️ تم رفع ${file.name}`;
                        uploadStatus.style.color = "var(--accent)";
                    } else {
                        uploadStatus.innerText = `❌ فشل رفع ${file.name}`;
                        uploadStatus.style.color = "#ef4444";
                    }
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';
                        uploadStatus.innerText = '';
                        resolve();
                    }, 1000);
                };

                xhr.onerror = () => {
                    uploadStatus.innerText = `❌ انقطع الاتصال أثناء الرفع`;
                    uploadStatus.style.color = "#ef4444";
                    resolve();
                };

                // إرسال الكائن الثنائي الحقيقي (Blob/ArrayBuffer)
                xhr.send(file);
            });
        }

        setInterval(fetchFiles, 3000);
        fetchFiles();
    </script>
</body>
</html>
